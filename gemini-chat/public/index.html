<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gemini Chat</title>
  <meta name="description" content="A clean AI chat assistant powered by Gemini 3.8 Flash." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10z"/></svg>
        </span>
        <span>Gemini Chat</span>
      </div>
      <div class="actions">
        <button class="btn" id="newChat" type="button">New chat</button>
        <button class="btn icon" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main class="scroller" id="scroller">
      <section class="empty" id="empty">
        <h1>What can I help you with?</h1>
        <p>Ask about code, concepts, writing, or ideas.</p>
        <div class="chips">
          <button type="button" class="chip" data-prompt="Explain closures in JavaScript with a simple example">Explain closures in JavaScript</button>
          <button type="button" class="chip" data-prompt="Suggest a clean folder structure for a MERN stack project">MERN project folder structure</button>
          <button type="button" class="chip" data-prompt="Give me a 4-week plan to practice data structures and algorithms">4-week DSA practice plan</button>
          <button type="button" class="chip" data-prompt="Explain the difference between REST and GraphQL in a table">REST vs GraphQL</button>
        </div>
      </section>
      <div class="thread" id="thread" aria-live="polite"></div>
    </main>

    <footer class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Message Gemini" aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
      <p class="hint">AI can make mistakes. Check important information.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
